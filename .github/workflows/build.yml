name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          unzip -q SKIBIDI-MERGED-SRCv6-full.zip
          cd SKIBIDI-MERGED-v4
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-debug
          path: SKIBIDI-MERGED-v4/build/libs/*.jar
